# ============================================================
# GENERAL SETTINGS
# ============================================================

# Terminal presented by tmux to applications running inside it
set -g default-terminal "tmux-256color"

# Describe the real terminal running tmux
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# Increase scrollback buffer
set -g history-limit 50000

# Start window and pane numbering at 1
set -g base-index 1
set -g pane-base-index 1

# Renumber windows after one is closed
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# Small delay for Escape and Alt key sequences
# More reliable over SSH than escape-time 0
set -sg escape-time 10

# Faster command-sequence timing
set -g repeat-time 300

# Reduce unnecessary redraws
set -g status-interval 5

# Allow applications to focus correctly
set -g focus-events on

# Improve passthrough support for modern terminal applications
set -g allow-passthrough on

# Keep more environment variables when attaching
set -g update-environment \
    "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"

# Do not automatically rename windows
set -g automatic-rename off
set -g allow-rename off

# Enable activity monitoring without visual alerts
setw -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g bell-action none


# ============================================================
# PREFIX
# ============================================================

# Change prefix from Ctrl-b to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


# ============================================================
# CONFIG RELOAD
# ============================================================

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"


# ============================================================
# STATUS BAR TOGGLE
# ============================================================

bind b set-option -g status


# ============================================================
# WINDOWS AND PANES
# ============================================================

# Split panes while preserving the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

# Create a new window in the current directory
bind c new-window -c "#{pane_current_path}"

# Close pane without prompting
bind x kill-pane

# Close window without prompting
bind X kill-window


# ============================================================
# PANE NAVIGATION
# ============================================================

# Alt-arrow pane switching without prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Vim-style pane navigation with prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Return to the previously active pane
bind Space last-pane


# ============================================================
# PANE RESIZING
# ============================================================

# Shift-arrow resizing without prefix
bind -n S-Left  resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Up    resize-pane -U 2
bind -n S-Down  resize-pane -D 2

# Repeatable Vim-style resizing with prefix
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2


# ============================================================
# KEY BEHAVIOUR
# ============================================================

# Alt-Backspace sends Ctrl-w
bind-key -n M-BSpace send-keys C-w

# Preserve terminal clear-screen behaviour
bind C-l send-keys C-l

# Synchronise typing across panes
bind S setw synchronize-panes \; display-message "Synchronize panes: #{?pane_synchronized,on,off}"


# ============================================================
# SESSION SWITCHER
# ============================================================

bind-key f run-shell "tmux new-window ~/.local/bin/tmux-sessionizer"
bind-key D run-shell "~/.local/bin/tmux-sessionizer ~/developer"
bind-key C run-shell "~/.local/bin/tmux-sessionizer ~/macos-config"
bind-key H run-shell "~/.local/bin/tmux-sessionizer ~"


# ============================================================
# STATUS BAR
# ============================================================

set -g status on
set -g status-position top
set -g status-justify absolute-centre

# Tomorrow Night Eighties-compatible colours
set -g status-style "fg=#cccccc,bg=default"

# Session name on the left
set -g status-left-length 40
set -g status-left "#[fg=#99cc99,bold] #S #[default]"

# Keep the right side empty
set -g status-right-length 0
set -g status-right ""

# Inactive windows
set -g window-status-format " #[fg=#999999]#I:#W#{?window_flags, #F,} #[default]"

# Active window
set -g window-status-current-format " #[fg=#2d2d2d,bg=#cccccc,bold]#I:#W#{?window_flags, #F,} #[default]"

set -g window-status-separator ""


# ============================================================
# PANE BORDERS
# ============================================================

set -g pane-border-style "fg=#595959"
set -g pane-active-border-style "fg=#6699cc"

# Show pane titles only when multiple panes exist
set -g pane-border-status off


# ============================================================
# MESSAGES AND COMMAND PROMPT
# ============================================================

set -g message-style "fg=#2d2d2d,bg=#ffcc66"
set -g message-command-style "fg=#2d2d2d,bg=#99cc99"

set -g mode-style "fg=#2d2d2d,bg=#6699cc"


# ============================================================
# COPY MODE
# ============================================================

# Vim keybindings in copy mode
setw -g mode-keys vi

# Enter copy mode
bind [ copy-mode

# Begin selection
bind -T copy-mode-vi v send-keys -X begin-selection

# Toggle rectangle selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Copy to the macOS clipboard and exit copy mode
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Copy current selection without exiting
bind -T copy-mode-vi Y send-keys -X copy-pipe "pbcopy"

# Mouse drag selection copies to macOS clipboard
bind -T copy-mode-vi MouseDragEnd1Pane \
    send-keys -X copy-pipe-and-cancel "pbcopy"

# Page movement
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down

# Jump to beginning or end
bind -T copy-mode-vi g send-keys -X history-top
bind -T copy-mode-vi G send-keys -X history-bottom


# ============================================================
# WINDOW NAVIGATION
# ============================================================

# Alt-number window switching
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Previous and next window
bind -n M-, previous-window
bind -n M-. next-window


# ============================================================
# SSH AND TERMINAL COMPATIBILITY
# ============================================================

# Forward SSH agent state when reattaching
set -g update-environment "SSH_AUTH_SOCK SSH_CONNECTION DISPLAY"

# Keep pane working directories when reconnecting
set -g default-command "${SHELL}"

# Avoid alternate-screen history loss where possible
set -g alternate-screen on


