# ============================================================================
# AeroSpace Configuration — config-version 2
# Save as: ~/.aerospace.toml
# ============================================================================

# Config compatibility version
config-version = 2

# ============================================================================
# STARTUP & LOGIN
# ============================================================================

start-at-login = true

# Keep false if you prefer to reload manually.
auto-reload-config = false

# JankyBorders: coloured active/inactive window borders.
# Install first:
#   brew tap FelixKratz/formulae
#   brew install borders
after-startup-command = [
    'exec-and-forget borders style=round width=3.0 active_color=0xffcba6f7 inactive_color=0xff45475a'
]

# ============================================================================
# NORMALIZATION
# ============================================================================

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# ============================================================================
# LAYOUT SETTINGS
# ============================================================================

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 30

# ============================================================================
# BEHAVIOUR
# ============================================================================

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

persistent-workspaces = [
    '1', '2', '3', '4', '5', '6', '7', '8', '9',
    'M', 'T', 'S',
]

# ============================================================================
# WINDOW RULES
# Keep these root-level array-of-table entries above the TOML tables below.
# ============================================================================

[[on-window-detected]]
if = 'test %{app-bundle-id} = org.jeffvli.feishin'
run = 'move-node-to-workspace M'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.mitchellh.ghostty'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if = 'test %{app-bundle-id} = ru.keepcoder.Telegram'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if = 'test %{app-bundle-id} = net.whatsapp.WhatsApp'
run = 'move-node-to-workspace S'

# ============================================================================
# EXECUTABLE PATH
# Lets AeroSpace find Homebrew commands such as `borders` on Apple Silicon
# and Intel Macs.
# ============================================================================

[exec]
inherit-env-vars = true

[exec.env-vars]
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/local/sbin:${PATH}'

# ============================================================================
# GAPS & SPACING
# ============================================================================

[gaps]
inner.horizontal = 9
inner.vertical = 5
outer.left = 9
outer.right = 9
outer.top = 5
outer.bottom = 5

# ============================================================================
# KEYBOARD LAYOUT
# ============================================================================

[key-mapping]
preset = 'qwerty'

# ============================================================================
# WORKSPACE TO MONITOR ASSIGNMENT
# ============================================================================

[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = ['27GN7', 'main']
7 = ['27GN7', 'main']
8 = ['27GN7', 'main']
9 = ['^.*AirPlay.*$', 'main']
M = 'main'
T = 'main'
S = 'main'

# ============================================================================
# KEY BINDINGS — MAIN MODE
# ============================================================================

[mode.main.binding]

# Applications
cmd-enter = 'exec-and-forget open -na Ghostty'

# Layout management
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Create the requested 3-window arrangement:
#   1. Start with three windows side by side.
#   2. Focus the middle window.
#   3. Press Option+Shift+U.
# Result: left window full-height; second above third on the right.
alt-shift-u = ['join-with right', 'balance-sizes']

# Window navigation
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Window movement
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Window resizing
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Workspace switching
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-m = 'workspace M'
alt-t = 'workspace T'
alt-s = 'workspace S'
alt-tab = 'workspace-back-and-forth'

# Move focused window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-m = 'move-node-to-workspace M'
alt-shift-t = 'move-node-to-workspace T'
alt-shift-s = 'move-node-to-workspace S'

# Enter service mode
alt-shift-semicolon = 'mode service'

# ============================================================================
# KEY BINDINGS — SERVICE MODE
# Enter with Option+Shift+Semicolon
# ============================================================================

[mode.service.binding]

# Reload config and leave service mode
esc = ['reload-config', 'mode main']

# Flatten a damaged/awkward workspace tree
r = ['flatten-workspace-tree', 'balance-sizes', 'mode main']

# Toggle floating/tiling
f = ['layout floating tiling', 'mode main']

# Close every window on the workspace except the focused one
backspace = ['close-all-windows-but-current', 'mode main']

# Group the focused window with its neighbour, then equalise sizes
alt-shift-h = ['join-with left', 'balance-sizes', 'mode main']
alt-shift-j = ['join-with down', 'balance-sizes', 'mode main']
alt-shift-k = ['join-with up', 'balance-sizes', 'mode main']
alt-shift-l = ['join-with right', 'balance-sizes', 'mode main']
